<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a1626">
<title>Lunar Miner</title>
<link rel="stylesheet" href="app.css">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
<div id="app">
  <div class="demo-banner" id="demoBanner" hidden>DEMO MODE — Telegram bot-এ খুললে real account চলবে</div>

  <header class="top-card card">
    <div class="top-row">
      <span class="top-label muted"><span id="coinTop"></span> Current collection</span>
      <button class="collect-btn" id="collectBtn">⛏ Collect earnings</button>
    </div>
    <div class="big-num"><span id="pendingNum">0.0000</span><span id="coinBig"></span></div>
    <div class="stat-row muted"><span>Hashrate <b class="accent" id="hashrate">0</b> TH/s</span><span>🕐 <span id="timer">--</span></span></div>
    <div class="progress"><div id="levelProgress"></div></div>
    <div class="note-row muted">ⓘ In-app balances do not count toward your level</div>
  </header>

  <main class="views">
    <section class="view map active" id="view-mine">
      <div class="map-inner" id="mapInner">
        <div class="path-line"></div>
        <div class="pit-pill"><button id="pitUp">‹</button><span id="pitName">Lunar surface pit</span><button id="pitDown">›</button></div>
        <div id="nodes"></div>
        <button class="locate-btn" id="locateBtn">🎯 Locate miner</button>
      </div>
    </section>

    <section class="view" id="view-tasks"><div class="list" id="tasksList"></div></section>
    <section class="view" id="view-miners"><div class="list" id="minersList"></div></section>

    <section class="view" id="view-wallet">
      <div class="list">
        <div class="card wallet-hero">
          <span class="muted">Wallet balance</span>
          <div class="big-num"><span id="walletBalance">0.0000</span><span id="coinWallet"></span></div>
          <p class="muted" id="walletMined">Total mined: 0</p>
          <div class="field">
            <input id="withdrawAmount" type="number" min="0" step="0.01" placeholder="Amount">
            <button class="btn" id="withdrawBtn">Withdraw</button>
          </div>
          <p class="muted" id="withdrawNote" style="margin-top:8px"></p>
        </div>
        <div id="withdrawHistory" class="list"></div>
      </div>
    </section>

    <section class="view" id="view-profile">
      <div class="list">
        <div class="card profile-hero">
          <div class="avatar" id="avatar">⛏</div>
          <div>
            <h3 id="profileName">Miner</h3>
            <p class="muted" id="profileUser"></p>
            <p style="margin-top:6px"><span class="chip pending" id="profileLevel">Novice</span></p>
          </div>
        </div>
        <div class="stats">
          <div class="card stat"><b id="statMined">0</b><span class="muted">Total mined</span></div>
          <div class="card stat"><b id="statHash">0</b><span class="muted">TH/s hashrate</span></div>
          <div class="card stat"><b id="statMiners">0</b><span class="muted">Miners owned</span></div>
          <div class="card stat"><b id="statTasks">0</b><span class="muted">Tasks done</span></div>
        </div>
        <button class="btn ghost" id="adminLink" hidden>🛠 Admin Panel</button>
      </div>
    </section>
  </main>

  <nav class="nav">
    <button data-tab="tasks"><span class="ico">📋</span>Tasks</button>
    <button data-tab="miners"><span class="ico">👷</span>Miners</button>
    <button data-tab="mine" class="mine-tab active"><span class="ico">💎</span>Mine</button>
    <button data-tab="wallet"><span class="ico">👛</span>Wallet</button>
    <button data-tab="profile"><span class="ico">🧑‍🚀</span>Profile</button>
  </nav>
</div>
<div id="toast"></div>
<script src="app.js"></script>
</body>
</html>
